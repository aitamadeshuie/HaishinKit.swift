name: Build iOS XCFrameworks

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build device XCFrameworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for scheme in Logboard HaishinKit RTMPHaishinKit; do
            archive_path="$PWD/build/$scheme.xcarchive"
            derived_data="$PWD/build/$scheme-derived-data"
            xcodebuild \
              -scheme "$scheme" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$archive_path" \
              -derivedDataPath "$derived_data" \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              SKIP_INSTALL=NO \
              archive
            framework_path="$(find "$archive_path" -type d -name "$scheme.framework" -print -quit)"
            module_path="$(find "$derived_data" -type d -name "$scheme.swiftmodule" -path "*Release-iphoneos*" -print -quit)"
            test -n "$framework_path"
            test -n "$module_path"
            mkdir -p "$framework_path/Modules"
            cp -R "$module_path" "$framework_path/Modules/"
            xcodebuild -create-xcframework \
              -framework "$framework_path" \
              -output "artifacts/$scheme.xcframework"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: haishinkit-ios-xcframeworks
          path: artifacts
